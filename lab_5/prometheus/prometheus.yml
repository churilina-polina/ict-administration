global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
