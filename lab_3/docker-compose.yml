services:
  # --- Kafka (режим KRaft, без ZooKeeper) ---
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топики создаём только декларативно, через topic-init - не даём
      # Kafka создавать их сама с настройками по умолчанию
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # по умолчанию Kafka проверяет retention раз в 5 минут - для лабы ускоряем проверку
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "10000"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- создание/обновление топика orders из конфигурации, без ручного CLI ---
  topic-init:
    build: ./topic-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOPIC_NAME: orders
      TOPIC_PARTITIONS: "1"
      TOPIC_REPLICATION_FACTOR: "1"
      TOPIC_RETENTION_MS: "604800000" # 7 дней
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  user-service:
    build: ./user-service
    ports:
      - "8010:8000"  # 8000 занят demo-service из lab_2
    environment:
      INSTANCE_NAME: user-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders
    depends_on:
      topic-init:
        condition: service_completed_successfully

  picker-service:
    build: ./picker-service
    ports:
      - "8001:8001"
    environment:
      INSTANCE_NAME: picker-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders
      KAFKA_GROUP_ID: pickers
      PROCESSING_SECONDS: "2"
    depends_on:
      topic-init:
        condition: service_completed_successfully

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      topic-init:
        condition: service_completed_successfully

  # --- мониторинг ---
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9091:9090"  # 9090 занят prometheus из lab_2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      - kafka-exporter

  alertmanager:
    image: prom/alertmanager:v0.28.0
    ports:
      - "9094:9093"  # 9093 занят alertmanager из lab_2
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  webhook:
    image: mendhak/http-https-echo
    ports:
      - "8082:8080"  # 8081 занят webhook-receiver из lab_2

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"  # 3000 занят grafana из lab_2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  kafka_data:
